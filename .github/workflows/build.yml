# SPDX-License-Identifier: GPL-2.0-only
# Lint and test the scripts on every push; build the .debs on an arm64 runner in an
# ubuntu:26.04 container on tags, by hand (workflow_dispatch), and for a pushed commit whose
# message contains [build].
# Actions are pinned by commit; the comment names the release.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n
        run: for f in scripts/*.sh tests/*.sh nvidia-dkms/postinst nvidia-dkms/prerm nvidia-dkms/postrm; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh nvidia-dkms/postinst nvidia-dkms/prerm nvidia-dkms/postrm
      - name: tests
        run: bash tests/run.sh

  debs:
    needs: lint
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container: ubuntu:26.04
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the packages in scripts/build-deps.txt
        run: |
          export DEBIAN_FRONTEND=noninteractive
          xargs -a scripts/build-deps.txt apt-get install -y -qq --no-install-recommends >/dev/null
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          bash scripts/build.sh --jobs "$(nproc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n1x-kernel-ubuntu-debs
          path: out/
          if-no-files-found: error
