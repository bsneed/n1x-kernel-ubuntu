# SPDX-License-Identifier: GPL-2.0-only
# DKMS build of NVIDIA's open kernel modules from the full source tree (src/ included), so
# that n1x-kernel-ubuntu's patches to nvkms and the DisplayPort library are compiled in.
# Ubuntu's nvidia-dkms-*-open links NVIDIA's prebuilt nv-modeset-kernel.o_binary instead.
PACKAGE_NAME="nvidia-n1x"
PACKAGE_VERSION="@NVIDIA_VERSION@"
AUTOINSTALL="yes"
MAKE[0]="unset ARCH; [ ! -h /usr/bin/cc ] && export CC=/usr/bin/gcc; env NV_VERBOSE=1 \
    make -j$(nproc) modules SYSSRC=${kernel_source_dir} IGNORE_CC_MISMATCH=1 \
    IGNORE_PREEMPT_RT_PRESENCE=1 LD=/usr/bin/ld.bfd"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="nvidia"
BUILT_MODULE_NAME[1]="nvidia-uvm"
BUILT_MODULE_NAME[2]="nvidia-modeset"
BUILT_MODULE_NAME[3]="nvidia-drm"
BUILT_MODULE_NAME[4]="nvidia-peermem"
BUILT_MODULE_LOCATION[0]="kernel-open"
BUILT_MODULE_LOCATION[1]="kernel-open"
BUILT_MODULE_LOCATION[2]="kernel-open"
BUILT_MODULE_LOCATION[3]="kernel-open"
BUILT_MODULE_LOCATION[4]="kernel-open"
DEST_MODULE_LOCATION[0]="/updates/dkms"
DEST_MODULE_LOCATION[1]="/updates/dkms"
DEST_MODULE_LOCATION[2]="/updates/dkms"
DEST_MODULE_LOCATION[3]="/updates/dkms"
DEST_MODULE_LOCATION[4]="/updates/dkms"
# Ubuntu's own workaround for the partial dma-buf backport in its 7.0 kernels
# (nvidia-dkms-620-open's buildfix_kernel_7.0-dma_buf_invalidate_mappings.patch, by
# Jacob Martin), with its paths moved under kernel-open/. Only for Ubuntu 7.0.0 kernels,
# as there.
PATCH[0]="ubuntu-7.0-dma-buf-invalidate-mappings.patch"
PATCH_MATCH[0]="^7\.0\.0-"
